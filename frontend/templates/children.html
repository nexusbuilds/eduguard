{% extends "base.html" %}

{% block title %}Children — EduGuard{% endblock %}
{% block page_title %}Children{% endblock %}

{% block content %}
<div class="grid lg:grid-cols-3 gap-6">
  <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
    <h3 class="text-lg font-bold text-slate-900 mb-4">Add New Child</h3>
    <form action="/api/children/" method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">First Name</label>
        <input type="text" name="first_name" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Last Name</label>
        <input type="text" name="last_name" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Birthdate</label>
        <input type="date" name="birthdate" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email (optional)</label>
        <input type="email" name="email" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
      </div>
      <button type="submit" class="w-full px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg transition">Add Child</button>
    </form>
  </div>

  <div class="lg:col-span-2 bg-white rounded-xl p-6 shadow-sm border border-slate-100">
    <h3 class="text-lg font-bold text-slate-900 mb-4">Your Children</h3>
    <div class="text-center py-8 text-slate-400">
      <i class="fas fa-users text-4xl mb-3"></i>
      <p>No children added yet.</p>
      <p class="text-sm">Add your first child to get started.</p>
    </div>
  </div>
</div>
{% endblock %}
