<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kid Login — EduGuard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-brand-900 to-teal-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-white/10 backdrop-blur-sm flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-shield-alt text-3xl text-white"></i>
      </div>
      <h1 class="text-3xl font-bold text-white">EduGuard</h1>
      <p class="text-white/60 mt-2">Kid Portal</p>
    </div>
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 border border-white/20">
      {% if error %}
      <div class="mb-4 p-3 bg-rose-500/20 border border-rose-500/30 rounded-lg text-rose-200 text-sm">{{ error }}</div>
      {% endif %}
      <form action="/kid/login" method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-white/80 mb-1">Your ID</label>
          <input type="number" name="child_id" required class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="Ask your parent for your ID">
        </div>
        <div>
          <label class="block text-sm font-medium text-white/80 mb-1">PIN</label>
          <input type="password" name="pin" required maxlength="4" pattern="\d{4}" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="4-digit PIN">
        </div>
        <button type="submit" class="w-full py-3 bg-brand-500 hover:bg-brand-400 text-white font-semibold rounded-xl transition">Sign In</button>
      </form>
    </div>
    <p class="text-center text-white/40 text-sm mt-6">Ask your parent to set your PIN in the Children section.</p>
  </div>
</body>
</html>
