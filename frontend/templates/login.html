{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900">
    <div class="w-full max-w-md p-8 bg-white dark:bg-gray-800 rounded-lg shadow-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">EduGuard Login</h1>
            <p class="mt-2 text-gray-600 dark:text-gray-400">Sign in to your account</p>
        </div>
        <form hx-post="/auth/login" hx-target="body" hx-swap="innerHTML" class="space-y-6">
            <div>
                <label for="email" class="block text-gray-700 dark:text-gray-300">Email</label>
                <input type="email" id="email" name="email" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <div>
                <label for="password" class="block text-gray-700 dark:text-gray-300">Password</label>
                <input type="password" id="password" name="password" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-teal-600 rounded border-gray-300 focus:ring-teal-500">
                    <label for="remember" class="ml-2 block text-gray-700 dark:text-gray-300">Remember me</label>
                </div>
                <a href="/forgot-password" class="text-teal-600 hover:text-teal-500">Forgot Password?</a>
            </div>
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 px-4 rounded-md">
                Sign In
            </button>
        </form>
        <div class="mt-6 text-center">
            <p class="text-gray-600 dark:text-gray-400">
                Don't have an account? <a href="/register" class="text-teal-600 hover:text-teal-500">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
