<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGuard Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="/static/css/custom.css">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const themeToggle = document.getElementById('theme-toggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    const html = document.documentElement;
                    html.classList.toggle('dark');
                    if (html.classList.contains('dark')) {
                        localStorage.setItem('theme', 'dark');
                    } else {
                        localStorage.setItem('theme', 'light');
                    }
                });
            }
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
            }
        });
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    <nav class="bg-teal-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 22.523 5.754 23 7.5 23s3.332-.477 4.5-1.247m3-1.017l.291-1.305c.053-.237.154-.455.291-.644a2.295 2.295 0 0 1 2.153-1.5c.679 0 1.283.381 1.5.978.155.414.193.864.105 1.294l-.29 1.304c-.053.238-.154.457-.291.645a2.295 2.295 0 0 0-2.153 1.5c-.679 0-1.283-.381-1.5-.978-.155-.413-.193-.863-.105-1.293" />
                </svg>
                EduGuard
            </a>
            <div class="flex space-x-4">
                <a href="/dashboard" class="hover:text-gray-300 px-2 py-1 rounded-md font-medium">Dashboard</a>
                <a href="/children" class="hover:text-gray-300 px-2 py-1 rounded-md font-medium">Children</a>
                <a href="/devices" class="hover:text-gray-300 px-2 py-1 rounded-md font-medium">Devices</a>
                <a href="/chores" class="hover:text-gray-300 px-2 py-1 rounded-md font-medium">Chores</a>
                <a href="/grades" class="hover:text-gray-300 px-2 py-1 rounded-md font-medium">Grades</a>
                <a href="/precommitment" class="hover:text-gray-300 px-2 py-1 rounded-md font-medium">Precommitment</a>
                <button id="theme-toggle" class="bg-gray-700 rounded-full p-2 hover:bg-gray-600 flex items-center justify-center">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>
    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-gray-800 text-white py-4 mt-8">
        <div class="container mx-auto text-center">
            <p>&copy; {{ current_year }} EduGuard. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
