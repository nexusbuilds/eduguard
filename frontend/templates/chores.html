{% extends "base.html" %}

{% block title %}Chores — EduGuard{% endblock %}
{% block page_title %}Chores{% endblock %}

{% block content %}
<div class="grid lg:grid-cols-3 gap-6">
  <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
    <h3 class="text-lg font-bold text-slate-900 mb-4">Create New Chore</h3>
    <form action="/api/chores/" method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
        <input type="text" name="name" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
        <textarea name="description" rows="2" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Assign to Child</label>
        <select name="child_id" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
          <option value="">Select a child...</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Reward Points</label>
        <input type="number" name="reward_points" value="10" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Due Date</label>
        <input type="date" name="due_date" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
      </div>
      <button type="submit" class="w-full px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg transition">Create Chore</button>
    </form>
  </div>

  <div class="lg:col-span-2 bg-white rounded-xl p-6 shadow-sm border border-slate-100">
    <h3 class="text-lg font-bold text-slate-900 mb-4">Active Chores</h3>
    <div class="text-center py-8 text-slate-400">
      <i class="fas fa-clipboard-list text-4xl mb-3"></i>
      <p>No chores created yet.</p>
      <p class="text-sm">Create your first chore to get started.</p>
    </div>
  </div>
</div>
{% endblock %}
