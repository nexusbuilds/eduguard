<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EduGuard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a', 950: '#172554'
            },
            teal: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
              400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
              800: '#115e59', 900: '#134e4a'
            }
          }
        }
      }
    }
  </script>
  <style>
    .sidebar-link { @apply flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-400 rounded-lg transition hover:bg-slate-800 hover:text-white; }
    .sidebar-link.active { @apply bg-slate-800 text-white; }
  </style>
</head>
<body class="font-sans antialiased bg-slate-50 text-slate-600">
  <!-- Mobile overlay -->
  <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed left-0 top-0 bottom-0 w-64 bg-slate-900 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
    <div class="p-6">
      <a href="/dashboard" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-500 to-teal-500 flex items-center justify-center">
          <i class="fas fa-shield-halved text-white text-sm"></i>
        </div>
        <span class="text-xl font-bold text-white">EduGuard</span>
      </a>
    </div>

    <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
      <a href="/dashboard" class="sidebar-link {% if request.url.path == '/dashboard' %}active{% endif %}">
        <i class="fas fa-home w-5 text-center"></i> Dashboard
      </a>
      <a href="/children" class="sidebar-link {% if request.url.path == '/children' %}active{% endif %}">
        <i class="fas fa-users w-5 text-center"></i> Children
      </a>
      <a href="/devices" class="sidebar-link {% if request.url.path == '/devices' %}active{% endif %}">
        <i class="fas fa-laptop w-5 text-center"></i> Devices
      </a>
      <a href="/chores" class="sidebar-link {% if request.url.path == '/chores' %}active{% endif %}">
        <i class="fas fa-check-circle w-5 text-center"></i> Chores
      </a>
      <a href="/grades" class="sidebar-link {% if request.url.path == '/grades' %}active{% endif %}">
        <i class="fas fa-graduation-cap w-5 text-center"></i> Grades
      </a>
      <a href="/precommitment" class="sidebar-link {% if request.url.path == '/precommitment' %}active{% endif %}">
        <i class="fas fa-lock w-5 text-center"></i> Precommitment
      </a>
      <a href="/wellness" class="sidebar-link {% if request.url.path == '/wellness' %}active{% endif %}">
        <i class="fas fa-heart-pulse w-5 text-center"></i> Wellness Hub
      </a>
      <a href="/reports" class="sidebar-link {% if request.url.path == '/reports' %}active{% endif %}">
        <i class="fas fa-chart-line w-5 text-center"></i> Reports
      </a>
      <div class="pt-4 mt-4 border-t border-slate-800">
        <a href="#" class="sidebar-link">
          <i class="fas fa-cog w-5 text-center"></i> Settings
        </a>
        <a href="/api/auth/logout" class="sidebar-link">
          <i class="fas fa-sign-out-alt w-5 text-center"></i> Logout
        </a>
      </div>
    </nav>

    <div class="p-4 border-t border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-brand-200 flex items-center justify-center text-brand-700 font-bold text-sm">
          {{ user.first_name[0] }}{{ user.last_name[0] }}
        </div>
        <div class="overflow-hidden">
          <div class="text-white text-sm font-medium truncate">{{ user.first_name }} {{ user.last_name }}</div>
          <div class="text-slate-500 text-xs truncate">{{ user.email }}</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <div class="lg:ml-64 min-h-screen flex flex-col">
    <!-- Top bar -->
    <header class="sticky top-0 z-30 bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 text-slate-600 hover:text-slate-900">
          <i class="fas fa-bars text-xl"></i>
        </button>
        <h1 class="text-xl font-bold text-slate-900">{% block page_title %}Dashboard{% endblock %}</h1>
      </div>
      <div class="flex items-center gap-4">
        <button class="p-2 text-slate-400 hover:text-slate-600 relative">
          <i class="fas fa-bell text-lg"></i>
          <span class="absolute top-1 right-1 w-2 h-2 bg-rose-500 rounded-full"></span>
        </button>
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobile-overlay');
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }
  </script>
</body>
</html>
