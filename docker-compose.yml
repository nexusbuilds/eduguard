version: '3.8'

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: eduguard-tailscale
    hostname: ${TS_HOSTNAME:-eduguard}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      - eduguard-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  fastapi:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: eduguard-api
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./frontend:/app/frontend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/eduguard.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=1440
      - DEBUG=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - eduguard-net
    restart: unless-stopped
    depends_on:
      - tailscale
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    container_name: eduguard-wg
    environment:
      - WG_HOST=${WG_HOST:-vpn.eduguard.local}
      - PASSWORD_HASH=$$2b$$12$$D4ByrQHP0XDLNESRldzs0.iVb8PgjjnZpcKl728srtE.JOu4Cx/bm
      - WG_PORT=51820
      - WG_DEFAULT_DNS=1.1.1.1,8.8.8.8
      - WG_PERSISTENT_KEEPALIVE=25
    volumes:
      - ./data/wg-easy:/etc/wireguard
    expose:
      - "51820/udp"
      - "51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks:
      - eduguard-net
      - wg-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:51821/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: eduguard-nginx
    ports:
      - "127.0.0.1:8080:80"
    expose:
      - "443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/static:/usr/share/nginx/html/static:ro
      - ./data/certs:/etc/nginx/certs:ro
    networks:
      - eduguard-net
    depends_on:
      - fastapi
      - tailscale
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  eduguard-net:
    driver: bridge
  wg-net:
    driver: bridge
