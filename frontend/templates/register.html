{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900">
    <div class="w-full max-w-md p-8 bg-white dark:bg-gray-800 rounded-lg shadow-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Create Account</h1>
            <p class="mt-2 text-gray-600 dark:text-gray-400">Sign up to get started</p>
        </div>
        <form hx-post="/auth/register" hx-target="body" hx-swap="innerHTML" class="space-y-6">
            <div>
                <label for="name" class="block text-gray-700 dark:text-gray-300">Full Name</label>
                <input type="text" id="name" name="name" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <div>
                <label for="email" class="block text-gray-700 dark:text-gray-300">Email</label>
                <input type="email" id="email" name="email" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <div>
                <label for="password" class="block text-gray-700 dark:text-gray-300">Password</label>
                <input type="password" id="password" name="password" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <div>
                <label for="confirm_password" class="block text-gray-700 dark:text-gray-300">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 px-4 rounded-md">
                Register
            </button>
        </form>
        <div class="mt-6 text-center">
            <p class="text-gray-600 dark:text-gray-400">
                Already have an account? <a href="/login" class="text-teal-600 hover:text-teal-500">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
