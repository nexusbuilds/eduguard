{% extends "base.html" %}

{% block title %}Devices — EduGuard{% endblock %}
{% block page_title %}Devices{% endblock %}

{% block content %}
<div class="grid lg:grid-cols-3 gap-6">
  <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
    <h3 class="text-lg font-bold text-slate-900 mb-4">Add New Device</h3>
    <form action="/api/devices/" method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Device Name</label>
        <input type="text" name="name" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Type</label>
        <select name="device_type" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
          <option value="laptop">Laptop</option>
          <option value="tablet">Tablet</option>
          <option value="phone">Phone</option>
          <option value="desktop">Desktop</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">MAC Address</label>
        <input type="text" name="mac_address" placeholder="00:00:00:00:00:00" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-brand-300 focus:border-brand-300 outline-none">
      </div>
      <button type="submit" class="w-full px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg transition">Add Device</button>
    </form>
  </div>

  <div class="lg:col-span-2 bg-white rounded-xl p-6 shadow-sm border border-slate-100">
    <h3 class="text-lg font-bold text-slate-900 mb-4">Your Devices</h3>
    <div class="text-center py-8 text-slate-400">
      <i class="fas fa-laptop text-4xl mb-3"></i>
      <p>No devices added yet.</p>
      <p class="text-sm">Add a device to enforce internet rules.</p>
    </div>
  </div>
</div>
{% endblock %}
