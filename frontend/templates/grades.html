{% extends "base.html" %}

{% block content %}
<div class="container mx-auto py-6">
    <h1 class="text-3xl font-bold mb-6 text-gray-800 dark:text-white">Grade Sync</h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Edsby Integration -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">Edsby Integration</h2>
            <div hx-get="/api/grades/integration" hx-trigger="load" hx-swap="innerHTML">
                <div class="text-center py-4">Loading integration status...</div>
            </div>
        </div>

        <!-- Grade History -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">Grade History</h2>
            <div hx-get="/api/grades/history" hx-trigger="load" hx-swap="innerHTML">
                <div class="text-center py-4">Loading grade history...</div>
            </div>
        </div>
    </div>

    <div class="mt-6">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">Access Rules</h2>
            <div hx-get="/api/grades/rules" hx-trigger="load" hx-swap="innerHTML">
                <div class="text-center py-4">Loading access rules...</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
